name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile project modules
        run: >-
          python -m py_compile
          audio_runtime.py backend_errors.py diagnostics.py orchestrator.py
          osc_control.py prompt_engine.py runtime_config.py runtime_scheduler.py
          streaming_core.py transcript_filter.py transcriber.py
